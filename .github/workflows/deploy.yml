# Proseforge — auto-deploy to Cloudflare Workers
# Place at: .github/workflows/deploy.yml in ola1de/Proseforge
# Triggers on every push to main. Requires GitHub Secrets:
#   CLOUDFLARE_API_TOKEN   — scoped API token (Workers Scripts Edit, D1 Edit, R2 Edit, Queues Edit)
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare Account ID (dashboard right sidebar)
# Do NOT put the token or account ID in this file or in wrangler.jsonc.
# Prerequisite: wrangler.jsonc database_id must be the real proseforge-db
# ID, not REPLACE_WITH_REAL_ID_AFTER_CREATION, or deploy will fail.
name: Deploy Proseforge

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
